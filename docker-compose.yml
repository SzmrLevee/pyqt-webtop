services:
  mysql:
    image: mysql:8.4
    container_name: pyqt-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"

    volumes:
      - mysql-data:/var/lib/mysql

    ports:
      - "127.0.0.1:3306:3306"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pyqt-phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      UPLOAD_LIMIT: "64M"

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "127.0.0.1:8081:80"

  webtop:
    build:
      context: .
      dockerfile: Dockerfile

    image: pyqt-webtop-local
    container_name: pyqt-webtop
    restart: unless-stopped

    security_opt:
      - seccomp:unconfined

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Budapest"
      TITLE: "PyQt5 fejlesztés"

      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: "${MYSQL_DATABASE}"
      DB_USER: "${MYSQL_USER}"
      DB_PASSWORD: "${MYSQL_PASSWORD}"

    volumes:
      - ./webtop-config:/config
      - ./:/workspace

    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"

    shm_size: "1gb"

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data: